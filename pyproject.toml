[project]
name = "local-workspace"
version = "0.1.0"
description = "Local notebook workspace for ad-hoc Brocc data analysis"
requires-python = "==3.12.*"
dependencies = [
    # secure-local-storage caches the SSO token in the macOS Keychain, so
    # only the first connect of the day opens a browser. The pandas extra is
    # what enables the connector's fast Arrow -> DataFrame path
    # (fetch_pandas_all), and pulls in pyarrow.
    "snowflake-connector-python[pandas,secure-local-storage]>=3.12",
    "pandas>=2.2",
    # Declared explicitly even though pandas and matplotlib both pull it in.
    # Notebooks use np.* directly, and a direct import belongs in the
    # dependency list rather than relying on another package to supply it.
    "numpy>=2.0",
    "pyarrow>=17",
    "ipykernel>=6.29",      # the kernel VS Code attaches to
    "jupyterlab>=4.2",
    "nbformat>=5.10",       # plotly needs it to render inside notebooks
    "plotly>=5.22",
    "matplotlib>=3.9",
    "openpyxl>=3.1",        # DataFrame.to_excel for exports
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "xlrd>=2.0.2",
    "pyxlsb>=1.0.10",
    "msoffcrypto-tool>=6.0.0",
    "pandera>=0.35.0",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/datalake"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.2",
    "pre-commit>=4.7.0",
]
