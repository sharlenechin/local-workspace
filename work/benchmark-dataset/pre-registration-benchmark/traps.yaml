# Failure modes seen on SELLER TAPES. EVERY ONE OF THESE WAS SILENT - it
# produced a plausible wrong answer and raised nothing.
#
# This is the BANK. Read it when a tape looks odd or a guard fires, and search
# by SYMPTOM - by what you are seeing, not by what you already understand.
# seen_on is the occurrence log: a trap naming your deal is worth the detour
# into that deal's CONTEXT.md, and a trap that names no deal of yours is not.
#
#   detector : a function over the RAW TAPE. Warns. Cannot fail a run.
#   guard    : an assertion over the OUTPUT. Refuses. Cannot see a defect that
#              never reached the output.
#   rule     : the judgement, where no check can decide it.
#
# !! TRAPS ABOUT OUR OWN PIPELINE ARE NOT IN HERE. A lesson about the engine,
#    the review or the agent's own conduct lives in `engine-lessons.yaml`, and
#    the ones that recur are compressed into standing rules in the agent
#    definition. They were mixed in here until 2026-10-13, which made a file
#    read once per deal a third larger than the thing it was read for. Keep
#    them apart: if the fix is a registry row or a mapping judgement it is a
#    TAPE trap; if the fix is a .py file it is an engine lesson.
#
# PROMOTION (scripts/promote.py reports what is due):
#   seen on 1 deal   stays prose, unless detection is structural and cheap
#   seen on 2 deals  -> DETECTOR, if visible in the raw tape, and a CASE
#   seen on 3 deals  -> GUARD, if a deterministic assertion exists
#   engine-level     -> CASE immediately, whatever the count
#
# !! GENERATED BY HAND BUT VALIDATED. This file was invalid YAML for a day and
#    nothing noticed, because nothing parsed it until promote.py did.

T1:
  title: A payment series is partly or wholly missing
  symptom: a deal shows 0 payments, or far fewer months than the sheet has columns
  cause: month headers in the seller's language decoded as English. Only the months whose first three
    letters collide survive (JANeiro, JUNho, JULho, NOVembro); the other eight vanish.
  detector: detect_untranslated_months
  seen_on:
    PT15018:
      detail: Portuguese headers on Excel row 23, English on row 25; the reader landed on the Portuguese
        one
      cost: 22 of 26 months dropped
    PT16023:
      detail: same shape
      cost: 621,888 payment rows were invisible
T2:
  title: Every figure in a book is exactly doubled
  symptom: totals are 2x what the summary says
  cause: byte-identical duplicate files, e.g. 'x.xlsb' and 'x (1).xlsb'
  detector: detect_duplicate_files
  guard: duplicate_files == 0
  seen_on:
    PT15018:
      detail: MD5 b063f5610f009006fc732f5c0ca385b7
      cost: payments doubled
    PT19007:
      detail: Debt Sale WZ 09-2019.xlsx shipped twice
    PT21004:
      detail: PT21004A012210 and its (1) copy
T3:
  title: A sheet lands with meaningless column names
  symptom: columns read as 'PART B', 'PART B.1' or mostly 'Unnamed'
  cause: a merged banner title above the real header. pandas de-duplicates it into PART B.1..N, so only
    HALF the columns look Unnamed and a '>60% unnamed' test never fires.
  detector: detect_banner_header
  seen_on:
    PT15018:
      detail: Other Participants on file 2-3
      cost: sheet unusable through two reloads
T4:
  title: One loan has column names where its values should be
  symptom: a row whose loan_id is text like 'Account Number'
  cause: the sheet labels every column TWICE (Portuguese then English). Whichever row pandas takes as
    the header, the other arrives as data.
  detector: detect_double_header
  guard: reject a row whose loan_id equals any column name on the sheet
  seen_on:
    PT15018:
      detail: Claims, Main Debtors and Other Participants - all of them
T5:
  title: A total is wildly wrong, or a mapped column is entirely null
  symptom: EUR 66,924 reads as 6.6e18, or a column is 100% null after mapping
  cause: TWO DECIMAL CONVENTIONS IN ONE SHEET. Capital writes 64843.73 (dot), Montante de Capital Inicial
    writes 48000,00 (comma). Side by side.
  detector: detect_mixed_decimals
  guard: no amount column entirely null, none entirely zero where filled
  seen_on:
    PT15018:
      detail: the Claims sheet
      cost: every origination value nulled
T6:
  title: Not supplied appears as zero
  symptom: a loan has a real balance but an origination amount of 0
  cause: pandas sums [NaN, NaN] to 0.0. A null passing through a groupby becomes a confident zero.
  guard: min_count=1 on every summed column
  seen_on:
    PT15018:
      detail: all 1,555 loans read as originated for nothing
      cost: only caught because a human asked how that was possible
T7:
  title: A join returns almost nothing, or money orphans
  case: system_ids_are_detected_not_joined_on
  symptom: an id that looks right matches 0-1% of the other side
  cause: a (System) or (Sistema) id, renumbered between deliveries. The ORIGINAL id is stable; the system
    one is not.
  detector: detect_system_id_twins
  guard: system_id_spanning_accounts == 0
  seen_on:
    PT15018:
      detail: '25 column pairings tested: original x original 673, system x system 0'
      cost: 82 of 99 payment rows orphaned, EUR 892,057
    PT16023:
      detail: COMP_OPER_PROD (Unique Loan ID in the System) is 'N.A.' on many rows
  promoted: 2026-10-13 - seen on a second deal
T8:
  title: A total is short and nothing explains it
  symptom: the detail sums to less than the published figure
  cause: rows whose id is 'Not Available' dropped by a numeric-id filter
  guard: in_scope_balance must equal the published figure
  seen_on:
    PT15018:
      detail: 107 in-scope loans with no account number
      cost: EUR 1,673,770.57 silently missing
T9:
  title: Collections are overstated
  case: a_return_series_beside_a_payment_series_is_found
  detector: detect_paired_payment_series
  symptom: payments exceed the balance movement
  cause: a SECOND monthly series beside the first - JAN15pay and JAN15ret (returns/reversals). Counting
    only pay overstates; they must net.
  seen_on:
    PT15014:
      detail: pay 14,362.85 against ret 260.00
    PT15016:
      detail: pay 16,842.19 against ret 85.00
  promoted: 2026-10-13 - seen on a second deal
T10:
  title: Payments double-count
  symptom: a total is about 2x a published collections figure
  cause: a SUBTOTAL column mapped as if it were a payment. PT15018's Interim Collections is exactly the
    sum of the last five monthly columns.
  seen_on:
    PT15018:
      detail: equal on all 32,873 rows, EUR 1,576,052.40
T11:
  title: A flag says no when it means we do not know
  symptom: a (Y/N) column whose only values are Yes and Not Available
  cause: there is no 'No'. Writing False asserts something the tape never said.
  detector: detect_yn_without_no
  rule: Whether False is writeable is a property of the COLUMN, not a constant. If the column contains
    a negative value anywhere, False is real information and nulling it discards genuine negatives. If
    it does not, every non-yes is unknown.
  seen_on:
    PT15018:
      detail: 'Reclamado Judicialmente: 1,450 Yes, 105 Not Available, NO ''No''. Cross-checked: 0 loans
        have a court process but an unknown flag'
    PT16023:
      detail: Judicialized? holds Y (12,743) and a real N (6,691) - here False means genuinely not in
        court
T12:
  title: A population silently disappears
  detector: detect_population_split_across_sheets
  symptom: the output has fewer loans than a source sheet describes
  cause: anchoring on the wrong sheet. Whichever sheet defines the population, loans only in the OTHER
    sheet cease to exist.
  guard: in_scope_loans and in_scope_balance must equal the published figures
  seen_on:
    PT15018:
      detail: 'anchored on detail: lost 31,000 loans. Anchored on the tallying sheet: lost 882 carrying
        EUR 15.4m. Resolved by the strats, which exclude the 882 as contingent exposure'
    PT16023:
      detail: collapsing on the composite id gave 18,283 against a published 19,434. Grain is now a per-deal
        registry setting
  promoted: 2026-10-13 - seen on a second deal
T13:
  title: A short token matches everywhere and means nothing
  symptom: a search for a marker hits plausibly in many places
  cause: short strings collide for free in a large corpus. A 6-digit number lands in a 1.3m pool 4.49%
    of the time by chance.
  rule: Only accept a match whose chance floor is negligible. An exact reconciliation on eleven significant
    digits is evidence; a 6-digit token match is not.
  seen_on:
    PT15014:
      detail: searching cell contents for 'BO' (binding offer) hit Portuguese street addresses - BO is
        short for bairro
    PT20006:
      detail: reference_number matched 6.19% against a 4.49% chance floor - noise, not a key
    PT20014:
      detail: a magnitude-based strats harvest found 5,204 candidates and 156 'exact' hits, all coincidence
T14:
  title: A date arrives as an Excel serial number
  symptom: a date column holds values like 42402
  cause: Excel stores a date as days since 1899-12-30, and some exports ship the NUMBER. Parsed as a date
    it is null; parsed as a number it is a plausible 42,402 that no guard questions.
  seen_on:
    PT16023:
      detail: Delinquency Date and Insolvency Date both ship as serials
      cost: both columns would have been entirely null
T15:
  title: A composite id collapses because its parts are zero
  symptom: many loans share a handful of ids like 0_0_CCJ
  cause: the id is Company_Account_Product concatenated, and some rows carry 0 for both company and account,
    so the composite degenerates to the product code.
  rule: Keep them - the money is real - but never collapse on a composite id without checking its parts
    are populated.
  seen_on:
    PT16023:
      detail: 81 loans carrying EUR 3,422,668.84 share 8 ids
      cost: harmless at row grain, but collapsing on that id would merge 81 unrelated loans into 8. Found
        by the approval sheet, not by any guard.
T16:
  title: The same fact is stated at two grains - which wins?
  detector: detect_fact_stated_at_two_grains
  symptom: a field is mapped from BOTH a loan-level column and a party sheet
  cause: a tape can state a fact about the LOAN or about the PERSON, and some ship both. Taking the wrong
    one is silent.
  rule: 'THE FINER GRAIN WINS. A fact about THIS LOAN beats the same fact about a PERSON inherited by
    every loan they hold - PT15018 borrowers hold up to 21. Mapped at both levels: keep the loan value,
    let the party level fill only its nulls. Only party level: roll up with max(), which is a FLOOR, never
    a denial.'
  consequence: The same column name means different things across deals. judicialised_flag = False means
    'not in court' on PT16023 and 'we do not know' on PT15018. Both pass every guard. Carry this into
    any stitch.
  seen_on:
    PT15018:
      detail: Reclamado Judicialmente is PERSON level on two party sheets, joined on client and rolled
        up
      cost: taking Main Debtors alone loses 200 Yes from co-holders
    PT16023:
      detail: Judicialized? is a column on the LOAN row - no join, no rollup
  promoted: 2026-10-13 - seen on a second deal
T17:
  title: The join column is named differently on each sheet
  symptom: a party-level field comes out entirely null despite the column existing
  cause: the same identifier wears different names across sheets of ONE workbook.
  rule: Discover the join column by VALUE OVERLAP, not by name. Take the column that beats the next best
    by a wide margin; a fixed threshold is wrong because a guarantor sheet legitimately overlaps only
    8%.
  seen_on:
    PT15018:
      detail: Cliente Number on Collections, Numero de Cliente Interno on the party sheets
      cost: 1,450 judicialised flags silently lost; the backtest caught it, nothing else would
T18:
  title: A segment label carries a fact, but never carries its negative
  symptom: a flag the tape plainly supports comes out entirely null, or - worse - comes out False on
    thousands of loans the seller never made any statement about.
  cause: the fact is encoded as one value of a multi-valued segment column rather than as a Y/N column.
    PT18019 has no insolvency column at all; it has `Perimeter`, whose four labels are Bankruptcy,
    Category 1, Category 2 and Deceased. Bankruptcy IS the insolvency flag. Dropping the field as
    "not on this tape" discards 9,298 real facts, and mapping it with a plain equality test invents
    22,401 False values the seller never wrote.
  detector: detectors.py flags any low-cardinality text column whose values include a schema-relevant
    term (bankrupt, insolven, falencia, judicial, deceased, obito) while the matching schema field is
    unmapped for that deal.
  guard: guards.py counts the True values and prints the NULL count beside it, so a flag that went
    all-null or all-False is visible rather than inferred.
  rule: Use the `eq:<value>` transform. It writes True on a match and NULL everywhere else - never
    False. The other labels say what a loan IS, not that it is not the thing being tested. Where a
    tape DOES publish an explicit negative, use `yn` instead; the value lives in mappings.csv so the
    choice is data, not code. This is T11 generalised from Y/N columns to segment columns.
  seen_on:
    PT18019:
      detail: Perimeter = Bankruptcy on 9,298 of 31,699 loans; no Y/N insolvency column exists
      cost: caught at mapping time. Had it been mapped with a plain equality, 22,401 loans would
        have been asserted solvent on no evidence.
T19:
  title: A column called "Unique Loan ID" that is not unique
  symptom: nothing, at cleaning time. The deal reconciles to the cent, every check passes, and the
    defect only appears downstream as a fan-out at the bridge or a double-counted balance.
  cause: the seller builds the id by concatenating fields, and where a component is missing or shared
    the composite collapses. PT16023's `COMP_OPER_PROD (Unique Loan ID)` yields `0_0_CMC` whenever two
    components are zero, and that one value sits on loans belonging to DIFFERENT clients.
  detector: detectors.py counts distinct values against row count for any column the registry maps to
    loan_id, and warns before the deal is cleaned.
  guard: guards.py `loan_id unique`. Fails unless the count is pinned in EXPECT as `duplicate_loan_ids`,
    so a human has seen the number; any CHANGE in it then re-fails.
  rule: Never invent a surrogate key to make the duplicate go away. The rows are right - the row count
    ties to the seller's published figure - and the id is simply not a key. Pin the count, carry the
    defect forward in writing, and let the bridge be told. A column's NAME is not evidence.
  seen_on:
    PT16023:
      detail: 1,877 rows share 723 ids, EUR 22,713,253.39 of 224,485,808.25 (10.1%)
      cost: none yet. Found only because a guard written for a deal with no strats was run against the
        deals that already had them.
T20:
  title: Payment columns are relative to a cut-off the tape never states
  symptom: a payments total that looks like every other deal's and cannot be placed on a timeline,
    compared across deals, or cut by period.
  cause: the seller heads the columns -12M..-1M and 1M..3M instead of with real months. There is no
    anchor anywhere on the tape, so no decoder can supply one - this is a MISSING FACT, not a parse
    failure, and no amount of cleverness fixes it.
  detector: load_tapes records `period` verbatim and leaves `period_month` NULL; summarise.py prints
    the warning whenever a deal has payment rows but zero decodable months.
  guard: none possible. A guard reads the output, and the output is correct - the dates genuinely
    do not exist.
  rule: Keep the relative label in `period`, leave `period_month` NULL, and say so loudly in the
    summary. Never invent an anchor from the file date or the cut-off of another deal. Ask the deal
    owner. Note the sign convention is the OPPOSITE of a collections sign - here the minus means
    BEFORE the cut-off, not a reversal.
  seen_on:
    PT18019:
      detail: 15 relative periods, 12 before the cut-off and 3 after, EUR 10,615,169.65 total
      cost: the regex matched only `-\d+M`, so the 3 post-cut-off columns - 95,097 cells and
        EUR 2,359,907.66 of the most valuable data on the tape, actual performance AFTER the
        diligence date - were dropped silently. The deal still cleaned, guarded and summarised.
T21:
  title: The published total sits INSIDE the detail sheet, and gets counted as a loan
  symptom: the deal appears to have no published figure at all, and the detail column sums to exactly
    TWICE the real total. Nothing fails - the output is internally consistent and the reconciliation
    simply never happens, so the deal is recorded as `consistent` when it could be `reconciled`.
  cause: the seller writes a grand total at the bottom of the detail sheet rather than on a summary
    tab. Two separate things then go wrong. The harvest only scanned sheets shorter than 60 rows, so
    it never looked; and the cleaner has no reason to treat the row as anything but another account,
    so the population gains a phantom loan holding the whole book.
  detector: find_strats scans the last 6 rows of every LARGE sheet and tests each big number against
    the sum of its own column above it. On five thousand rows that test is far stronger than on a
    three-row summary block - hitting the sum of five thousand numbers by coincidence does not happen.
  guard: the exclusion is published, not inferred. find_strats writes the proven rows to
    `total_rows` in the strats JSON and clean_accounts drops exactly those, so the cleaned population
    is identical to the one the reconciliation was measured on.
  rule: Never drop a footer row because it LOOKS like a total, and never keep one because the sheet is
    large. Prove it equals the sum above it, record which row it was, and have one component do the
    proving and the other obey it.
  seen_on:
    PT15020:
      detail: row 5314 of a 5,318-row sheet holds 1,850,682.30 / 1,339,500.46 / 511,181.84 - balance,
        principal and interest, each the exact sum of its column, and summing to each other.
      cost: the deal was recorded as "no published figure, `consistent` only" while reconciling three
        separate ways to the cent.
    the WiZink family:
      detail: nine of twelve books carry one, one per monthly sheet - 21 on PT20014, 19 on PT21004,
        9 on PT19007, 8 on PT19013, 7 on PT15014, 5 on PT20006.
      cost: none yet, none of those deals had been loaded. Every one would have gained a phantom
        account per sheet holding that sheet's entire balance.
T22:
  title: A footer calculation carries an amount and is still not a loan
  symptom: the largest balance in the book is not a loan. On PT15014 it was EUR 182,514.73 - the purchase
    price - sitting in cutoff_balance beside a row holding 0.081, the price percentage.
  cause: below the grand total, sellers leave working - a price, a rate, a subtotal. These pass a quantity
    test because they ARE quantities, and they pass an id test because the id is simply blank.
  detector: none. The row is indistinguishable from a loan by content alone - only by POSITION.
  guard: guards.py loan_id unique, and the data-type integrity max, which is how the 182,514.73 was noticed
    at all. The real fix is in clean_accounts, below.
  rule: 'Drop a row only when BOTH hold - it TRAILS the last row of its sheet carrying a loan_id, AND
    at most one mapped field is populated. Both are needed. Trailing alone is not enough, and sparse alone
    is far worse: PT15018 has 106 REAL loans with no account number worth EUR 1,673,770.57 sitting among
    the others, and a sparseness rule on its own would delete them.'
  seen_on:
    PT15014:
      detail: WOFF_MASTER_201606 rows 585-586 hold 182,514.73 and 0.081, and 2,253,268.21 x 0.081 = 182,514.73
        exactly - the sheet's own total times the 8.1% purchase price on the calculation tab.
      cost: caught by the guard's max. Two phantom accounts, one of them the biggest in the book.
T23:
  title: A null segment silently drops the loan
  symptom: loans disappear from the population and the balance with no message, on a deal where the seller
    simply left a segment blank.
  cause: s.ne('Excluded') returns NA for a null cell on pandas 2.3, and boolean indexing drops a row whose
    mask is NA. The expression reads as 'keep everything that is not Excluded' and behaves as 'keep everything
    KNOWN not to be Excluded'.
  detector: none needed.
  guard: in_scope() in style.py is now the single definition, used by the cleaner, the guards, the summary
    and the cases. Only an EXPLICIT marker excludes.
  rule: Unknown is not a value. Any filter that decides scope must say what it does with NULL, and for
    scope the answer is always KEEP - a loan the seller forgot to label is still a loan. The same principle
    as T11 and T18, in the other direction.
  seen_on:
    the whole pipeline:
      detail: written the same wrong way in four separate files - clean_accounts, guards, summarise and
        cases - because each copied the expression from the last.
      cost: none realised; every deal loaded so far has a complete segment column. Found while chasing
        why PT15014's in-scope count looked right when two phantom rows were present - the count was right
        BY ACCIDENT, because those rows had a null segment and were being dropped by this bug rather than
        by the rule meant to catch them.
T24:
  title: The same sheet arrives twice under two filenames, and the bytes differ
  case: the_same_sheet_under_two_filenames_is_read_once
  symptom: the book cleans to exactly TWICE its published total, and nothing fails - the output is internally
    consistent, every loan is real, and each one is simply there twice.
  cause: a browser re-download leaving '(1)' or '(2)', a stray space before '.xlsx', an '__Analysis' copy,
    or the same file filed in two directories. The byte-level MD5 guard (T2) compares FILES and these
    differ in Excel metadata while the DATA is identical.
  detector: none needed - the loader now refuses to read the second copy.
  guard: 'load_tapes hashes each sheet''s CONTENT and skips a sheet whose (deal, sheet name, content)
    has already been read, printing which file it came from first. The in_scope_balance guard is the backstop:
    a doubled book cannot match a published figure.'
  rule: Deduplicate on CONTENT, not bytes, and key on the sheet NAME as well so two genuinely different
    monthly cohorts can never collide - their names carry the month. Never deduplicate a loan-level row
    this way; only a whole sheet that is identical to one already read.
  seen_on:
    PT20008:
      detail: the entire book twice - 5,810 loans against a published 2,905, EUR 11,503,688.66 against
        5,751,844.33, from '..._asset-index.xlsx' and '..._asset-index (1).xlsx'.
      cost: caught because the cleaned total was exactly 2x the seller's own figure. With no published
        figure it would have passed every check.
    the WiZink family:
      detail: 13 duplicate sheets across PT19007, PT19013, PT20006, PT20008 and PT20014 - including a
        894-row and an 801-row monthly cohort.
      cost: none realised; found before those deals were mapped.
  promoted: 2026-10-13 - seen on a second deal
T25:
  title: The summary tab in the seller's workbook is the BUYER's, not the seller's
  symptom: 'a clean-looking summary block - Principal, # Accounts, Avg size of case - that no column on
    the tape reproduces, and a long search for the filter that would make it tie.'
  cause: the workbook has been round-tripped through the buyer's own pricing system and carries its output.
    PT19007's `Summary Reflect` lists Price %, Price LCY, Total Price Adjustments and Total Net Price
    LCY beside the Principal. Those are purchase terms. No seller publishes the price it is being paid.
  detector: none automated. The tell is in the column names - a price, a discount, a net price, an adjustment
    - and in the sheet name.
  guard: none. The figure simply must not be used as a reconciliation target.
  rule: Reconcile only to a figure the SELLER published about the SELLER's book. A number computed by
    our own systems and pasted into the workbook proves that the buyer agrees with the buyer. When the
    only summary is of this kind, the deal is `consistent`, not `reconciled` - say so rather than reaching
    for the nearest number that ties.
  seen_on:
    PT19007:
      detail: Summary Reflect gives Principal 4,288,865.88 over 891 accounts. The account count matches
        a sheet exactly, so the pairing is certainly right; no balance column comes within 51,207.02 (1.2%).
        Brute-forcing every column against every single-value filter on that sheet reproduced it zero
        ways.
      cost: none - it was recognised before it was pinned. Had it been pinned, the deal would have carried
        a false `reconciled` for a figure that says nothing about the tape.
T26:
  title: Deduplicating a repeated loan id destroys loans
  symptom: two books that had reconciled to the cent for days lose 1,153 loans (EUR 12.2m) and 105 loans
    (EUR 4.5m) in one run, from a change made for a different deal entirely.
  cause: a rule written to collapse a loan reported in two monthly cohorts was applied to EVERY repeated
    loan_id. A repeated id inside ONE sheet is not the same loan twice - it is the seller's own data.
    PT16023's composite id is not unique (T19) and 1,153 accounts share one; PT15018 writes migration-split
    accounts under one number which a LATER step collapses by grain.
  detector: none needed.
  guard: in_scope_loans and in_scope_balance on both books. They failed within the minute, which is the
    only reason this is a comment and not a defect in the output.
  rule: 'Collapse a duplicate id ONLY when it spans more than one source sheet - that is the same loan
    observed in two cohorts, and the later observation wins because the sheet name carries the month.
    Within one sheet, never. More generally: a rule that removes rows must name the exact condition that
    makes a row redundant, and a repeated identifier is not that condition.'
  seen_on:
    PT21004:
      detail: the collapse was written for PT21004's 108 cross-month repeats and PT20014's single one.
        The blast radius was PT15018 and PT16023.
      cost: 'none reached the output. It also shows what the per-deal guards are actually for: the deals
        that caught it were not the deal being worked on.'
T29:
  title: A loan that defaults before it is originated
  symptom: nothing. Both dates parse, both are plausible years, and every total still ties. It is only
    visible if you compare the two.
  cause: the seller's own data entry. It is not a parse error - a mis-parsed date column shows up as thousands
    of wrong rows or an impossible year, not as one loan 30 days out.
  detector: none needed; the guard reads the output directly.
  guard: guards.py `default >= origination`, on every deal that maps both dates. Fails unless the count
    is pinned in EXPECT, so a human has seen it and any change re-fails.
  rule: default_date >= origination_date, ALWAYS. This is not a property of one seller - it held on every
    one of the 63,000-odd loans carrying both dates, across four sellers and twelve books, with a single
    exception. A rule that universal is worth asserting rather than merely observing, because the one
    loan that breaks it is a real defect somebody should hear about.
  seen_on:
    PT15018:
      detail: loan 1232400533, originated 2007-05-10 and defaulted 2007-04-10. The same loan also carries
        capital of 33,553.15 against a balance of 4,911.57 - it appears in both of this deal's open anomalies.
      cost: none yet. Raise it with the deal owner alongside the Claims-versus-Collections disagreement.
T30:
  title: A principal balance read as a total owed
  symptom: a book quotes a headline exposure that is actually principal only. Nothing fails - the figure
    reconciles to the seller's own published total, because the seller published that same principal.
  cause: the column is called OPB - Outstanding Principal Balance - and `balance` in the name reads as
    the whole of what is owed. PT15018's EUR 407,079,317.23 sat in `cutoff_balance` for a week on that
    reading.
  detector: 'none automated. The tell is in the seller''s own vocabulary: OPB, capital, principal, saldo
    contabilistico.'
  guard: the schema now defines cutoff_balance as the WHOLE of what must be repaid and nothing else, so
    a deal that publishes only a principal leaves it NULL. style.headline() decides which field a deal
    is measured on, and the summary, the guards and the approval sheet all ask it, so they cannot disagree.
  rule: cutoff_balance = principal + interest + fees + whatever else the seller adds. Where the tape states
    no total, the field is NULL and the deal is measured on cutoff_principal - with the approval sheet
    saying so in those words. NULL is a real answer; a principal wearing the name `balance` is not.
  seen_on:
    PT15018:
      detail: the Collections sheet carries only `Total OPB Setembro 2015` and `Total OPB 13-fev-2016`.
        Interest exists once, on the Claims sheet, for 673 of 32,529 loans - and that sheet is a record
        of amounts CLAIMED in proceedings, not of the loan, which is why its Capital and Juro were removed
        from the mapping entirely.
      cost: none reached a decision, but the largest deal in the book - 39% of it - was labelled as total
        exposure when it is principal.
T33:
  title: The payments key is the BORROWER, not the loan
  symptom: every payment row orphans, or worse, joins to the wrong grain and multiplies.
  cause: a payment sheet is keyed on whatever the seller's collections system uses, which is often the
    customer. PT15018's payments carry `Cliente Number` while its accounts are keyed on `Numero de Conta`;
    PT16023 the same. Assuming the payment id is the loan id loses everything.
  detector: none needed - the join itself reports what it chose.
  guard: clean_payments picks the key by VALUE OVERLAP against both loan_id and client_id, requires the
    winner to beat the next best 5x, and REFUSES to write anything when nothing overlaps or the choice
    is close.
  rule: Discover the payments key, never assume it, and record the grain in the output. A payments file
    at client grain is not wrong - it is simply not loan grain, and anything downstream must be told which
    it is.
  seen_on:
    PT15018:
      detail: 17,944 client numbers matched; the loan id matched nothing.
      cost: 'none. PT20008 was correctly refused: its only payments id is a row counter and that deal
        has no loan identifier at all.'
T34:
  title: A dense payment grid makes "no payment" and "no data" the same value
  symptom: 1.5m payment rows carrying about 109k facts - between 79% and 99.8% of them zero - and no way
    downstream to tell a month with no collection from a month the seller never reported.
  cause: 'sellers ship payments as a GRID: every loan gets a cell for every month in the window, paid
    or not. Carrying that through cleaning preserves the shape of the spreadsheet rather than the meaning
    of the data.'
  detector: none needed.
  guard: clean_payments records rows_out, zero_rows_dropped and months_covered, and guards.py reconciles
    the output back to the raw tape, so a filter that removed real money would fail immediately.
  rule: A row means A PAYMENT HAPPENED. Keep a month only where `pay` or `ret` moved - never test `net`,
    because 100 paid and 100 returned nets to zero and is two real events. The window stays recoverable
    as months_covered, so nothing is lost; what goes is the ambiguity between a zero and an absence.
  seen_on:
    the whole pipeline:
      detail: PT15018 fell from 466,544 rows to 4,053; PT16023 354,048 to 6,153; PT15014 163,783 to 373.
        Every gross, returns and net total is unchanged to the cent.
      cost: none realised - but any downstream average or count per loan-month would have been computed
        over 99% padding.
T43:
  title: Interim collections counted as historical performance
  symptom: a book's collection curve looks better than it is, and the same cash is counted twice - once
    as performance and once in the consideration.
  cause: payments were cleaned to one net figure per key per month with no label. Cash collected BEFORE
    the pricing cut-off is the seller's performance and the basis for any curve; cash collected BETWEEN
    the cut-off and completion is interim - it belongs to the buyer or adjusts the price. They are different
    money and they were indistinguishable.
  detector: none needed.
  guard: clean_payments writes a `period_type` on every row - before_cutoff, interim, after, or unknown
    - and the summary shows the split. The cut-off and completion months live in deals.csv.
  rule: Label the period, from DATA. A deal with no dated cut-off gets `unknown` and says so; inferring
    a cut-off from a sheet name is a guess, and a guess here silently reclassifies real money. PT15018's
    window was a hardcoded WINDOW list in guards.py - a per-deal fact in code, which the registry exists
    to prevent.
  seen_on:
    PT15018:
      detail: EUR 12,367,461.25 before the cut-off and EUR 1,569,881.63 interim, out of 13,937,342.88.
        Only this deal of twelve has dates NAMED on its tape.
      cost: none realised. The interim figure had been reconciled all along, but only inside one guard
        - nothing downstream could tell the two kinds of cash apart.
T44:
  title: A payments key that straddles the scope boundary
  symptom: the client-grain interim total reads EUR 16.52 above the seller's row-level published figure,
    and neither number is wrong.
  cause: payments are keyed on the BORROWER while scope is decided per LOAN. A client holding one in-scope
    loan and one excluded loan has payments that belong to both and divide into neither.
  detector: none needed.
  guard: clean_payments counts the straddling keys and their total, prints them, and records them in the
    metadata and on the summary.
  rule: Report it, never pro-rate it. Splitting a payment between two loans on a ratio nobody published
    is invention. State the grain of the payments file, state the straddle, and let the reader decide
    which figure their question needs.
  seen_on:
    PT15018:
      detail: 2 clients of 17,944, EUR 16.52 across the interim window.
      cost: none - but it would have read as an unexplained 16.52 discrepancy between two of our own figures,
        which is how people stop trusting both.
T45:
  title: The cut-off date read off a sheet instead of the deal
  symptom: accounts carry a cutoff_date that is ten months late and present on 2% of loans, and anyone
    splitting payments by it classifies the whole interim window as pre-cut-off performance.
  cause: cutoff_date was mapped like any other column - from PT15018's Claims sheet, Data de Referencia
    = 2016-07-08. That is when the LEGAL CLAIMS were measured, not when the book was struck (September
    2015). It is a property of a sheet; the cut-off is a property of the DEAL.
  detector: none needed.
  guard: cutoff_date is written from deals.csv onto EVERY loan, never mapped from a sheet. A deal with
    no known cut-off carries NULL, which downstream must read as 'cannot be split', not as zero.
  rule: Facts about the DEAL - seller, country, cut-off, completion - live in deals.csv and apply to every
    row. Facts about a LOAN come from the tape. Mapping a deal-level fact from whichever sheet happens
    to mention a date gets both the value and the coverage wrong.
  seen_on:
    PT15018:
      detail: 2016-07-08 on 673 of 32,529 loans, where the answer is 2015-09-30 on all of them. The deal
        reconciles to Total OPB Setembro 2015; the claims sheet is a different document measured ten months
        later.
      cost: none realised - found by the user reasoning that payments need not be filtered because the
        accounts carry the cut-off. They did not.
T46:
  title: A strat that will not tally because of interim collections
  symptom: a published total is close but not exact, and no scope filter fixes it. The gap looks like
    a rounding problem or a missing segment and is neither.
  cause: 'the seller struck the figure at one date and the tape''s balance column sits at another, with
    cash collected in between. PT15018 is the worked example: 407,079,317.23 at September 2015 and 405,509,452.41
    at 13-Feb-2016, EXACTLY 1,569,865.11 apart, which is the interim collections. Either figure is correct;
    they are ten months and one window of cash apart.'
  detector: none automated - the tell is a residual that EQUALS a collections figure somewhere else on
    the tape.
  guard: none possible. This is a question about which date the seller meant, and only the seller or the
    deal owner can answer it.
  rule: When a strat is close but will not tie, check the interim collections BEFORE looking for a scope
    rule. A published total may require interim to be added back, or subtracted, depending on which date
    the seller struck it at - and that is a property of the deal, not of the arithmetic. Record which
    date the figure belongs to in deals.csv; a total that ties at one date and not another is not a defect
    in either.
  seen_on:
    PT15018:
      detail: both dated balances are on the tape and the roll-forward closes to 29 cents, so the relationship
        is proven rather than assumed. The guard pins it as rollforward_residual.
      cost: none here, because the seller published both. On a deal that publishes only one date it would
        read as an unexplained gap.
T48:
  title: Two shapes of 'return', one arithmetic
  symptom: a reconciliation that held for three deals fails a fourth that is perfectly correct, with the
    output appearing to exceed the raw tape.
  cause: sellers store a reversal in two incompatible ways. PT15014 and PT15016 ship a separate `ret`
    SERIES with positive amounts, so the raw column sums to pay PLUS ret and the net is pay MINUS ret.
    PT18019 writes 18 NEGATIVE values inside the pay series, so the raw column already sums to the net.
    A check that sums the raw column and calls it either one is wrong for the other.
  detector: none needed.
  guard: guards.py and the PAYMENTS case both compute the raw NET using the seller's own series labels,
    then compare it to the cleaned net. The difference is what scope removed, and nothing else.
  rule: Never sum a raw amount column and call it a total without asking how that seller signs a reversal.
    The sign convention is decided once per deal and recorded; the SHAPE of the reversal must be read
    the same way.
  seen_on:
    PT18019:
      detail: positive 10,618,823.72 and negative -3,654.07, netting to 10,615,169.65 - which is exactly
        the raw column sum. The old formula computed 10,622,477.79 and declared it an overflow.
      cost: none - the PAYMENTS case failed the moment the file went long.
T51:
  title: An internal column counted as evidence of a loan
  symptom: two footer rows reappear in a book that had been right for days, putting EUR 182,514.73 back
    into PT15014 - triggered by adding an unrelated internal column.
  cause: the rule that drops a trailing footer row counts how many MAPPED fields it carries, and excluded
    internal columns by NAME - `_src_sheet`, `_src_file`. Adding `_src_row` for the account_key made every
    footer row look like it carried real data.
  detector: none needed.
  guard: in_scope_loans and in_scope_balance, which failed immediately. The exclusion is now one prefix
    test, `_src_`/`_fb_`, not a list of names.
  rule: Exclude internal columns by PREFIX, never by listing them. A list goes stale the next time one
    is added, and the failure surfaces somewhere unrelated - here, as money reappearing in a different
    deal's balance.
  seen_on:
    PT15014:
      detail: the same shape as the `_fb_` fallback-flag leak a day earlier. Second time; now impossible
        by construction.
      cost: none - the guard caught it in the same run.
T53:
  title: A delivery file the loader cannot read, stranded without a word
  symptom: a folder sits in the landing zone forever holding one file, and no report mentions it. It looks
    like a mistake and is never investigated.
  cause: intake and the loader both filter on spreadsheet extensions, which is right - and then say nothing
    about what they skipped. A .msg arrived with the PT20006 delivery named 'asset-index-aggregated';
    an email may well have the tape attached.
  detector: none needed.
  guard: intake lists every file it cannot read, by path, and leaves it where it is. check_new_data separately
    lists anything carrying no deal code.
  rule: Name what you skip. A filter that silently drops a file is indistinguishable from a filter that
    never saw it, and the difference matters when the thing dropped is an email with a workbook inside.
  seen_on:
    PT20006:
      detail: one .msg, stranded through every reload.
      cost: none known - nobody has opened it yet, which is the point.
T54:
  title: A book delivered twice, in a deal that has no loan id
  symptom: every figure in the deal is exactly double, or nearly so
  cause: clean_accounts compares candidate blocks by their loan_id sets, and the entire comparison
    was gated on loan_id being mapped at all. PT20008's seller ships no account number, so the deal
    had no duplicate protection of any kind. When a second copy of its book arrived - the same 2,905
    accounts the asset index already held, under the same sheet name Folha1 - the engine simply
    stacked them.
  detector: none. This is not visible in the raw tape; two deliveries of one book look like two files.
  guard: clean_accounts falls back to a ROW FINGERPRINT when there is no id, taken on the columns both
    blocks actually populate. Equal sets are one book delivered twice and the fuller copy is kept;
    a subset is dropped; a partial overlap REFUSES and the registry settles it with a `prefer` row.
  rule: Fingerprint on what both sides can speak to. Comparing every mapped field said the two copies
    differed on 1,205 of 2,905 rows, and the whole difference was five columns the asset index HAS and
    the portfolio file does not. A richer copy of a book is still the same book.
  seen_on:
    PT20008:
      detail: 5,810 accounts and EUR 11,503,688.66 against a true 2,905 and EUR 5,751,844.33.
      cost: none shipped. The published-strat guard failed within the minute - but a deal with no
        published figure would have shipped the double unnoticed, which is why this is now a rule.
T55:
  title: Our own output sitting in the raw folder, read as the seller's evidence
  symptom: a deal reconciles beautifully against a figure nobody at the seller ever published
  cause: a dump of "everything we have on this deal" can contain a file somebody downstream produced
    from that very book. PT15020 arrived with ONEY_PT15020_cleaned_aux.xlsx, whose columns are
    cutoff_principal, cutoff_fv, country, default_date, reflect_id. The strat scanner found four more
    published totals in it and every one matched the book exactly, because the book is where they
    came from.
  detector: detect_derived_file (T55) - three or more of OUR schema's core column names in one sheet.
    A seller writes Portuguese column names and its own system's ids. It does not write ours.
  guard: the file is moved to filed/<DEAL>/_derived/ with a WHY.md naming it. Underscore folders are
    kept forever and never loaded.
  rule: Circular evidence is worse than no evidence. Unverified is an honest state; reconciled against
    your own output is a false one, and nothing downstream can tell the difference.
  seen_on:
    PT15020:
      detail: n_strats_hits went 3 to 7 the moment the file was loaded.
      cost: none shipped. The strats guard pinned the hit count, so the four phantom figures showed up
        as a failure rather than as corroboration.
T57:
  title: A legal equivalence that is true in one country, applied everywhere
  symptom: nothing. Two populations a buyer prices differently are merged, and every total still ties.
  cause: Portugal has a single insolvency regime (insolvencia, under the CIRE) and no separate
    bankruptcy proceeding, so a seller writing `ind_bankruptcy`, `Perimeter = Bankruptcy` or
    `Insolvent? (Y/N)` is naming one legal state in three ways. Mapping all of them to
    `insolvent_flag` is correct there - six Portuguese deals depend on it. It is NOT correct
    everywhere. A US tape's Chapter 7 filing is not the same fact as balance-sheet insolvency,
    and a German tape separates Insolvenzverfahren from the state of being insolvent.
  detector: none possible. The tape cannot tell you what the words mean in law.
  guard: the ruling lives in `<country>/CONTEXT.md`, not in the shared engine, not in schema.yaml
    and not in a per-deal note. A country folder cannot inherit another country's file.
  rule: >-
    A domain equivalence is evidence about ONE jurisdiction and is recorded where that
    jurisdiction's facts live. The shared schema may hold the field; it must never hold the reason
    two of a seller's words collapse into it. The moment that reasoning moves up to the engine, the
    next country silently inherits a legal opinion nobody checked.
  seen_on:
    portugal:
      detail: insolvency and bankruptcy ruled the same thing by sharlene, 2026-10-11. Six deals
        map a column named for bankruptcy onto insolvent_flag; none keeps a separate field.
      cost: none. The mappings were already correct; what was missing was the stated basis, so
        anybody re-reading them saw two different words silently becoming one field.
T58:
  title: Two fields of one record, aggregated separately, describing a record that never existed
  symptom: a period that ends before it begins, on data where no single source row does that
  cause: person-level facts are rolled up to the loan with max(), one field at a time. That is right
    for a flag - a loan is judicialised if ANY party to it is - and wrong for a pair. PT15018's court
    dates come from `Proceedings Legal`; a client with two actions got the START of the later one and
    the END of the earlier one, and the two were written down as one proceeding. 316 loans ended
    before they began. The seller's sheet has ZERO such rows out of 1,103.
  detector: none. Every input row is valid; the defect is manufactured downstream.
  guard: guards.py checks EVERY `<x>_start_date`/`<x>_end_date` pair in additional_attributes, so a
    new pair on a new deal is covered the day it is mapped. clean_accounts rolls a bridged sheet up
    as a WHOLE RECORD - one proceeding per client, the most recent by start - so both dates always
    come from the same row.
  rule: >-
    Aggregate records, not fields, whenever two columns describe one event. max() per column answers
    a question nobody asked: not "what happened" but "what is the largest value of each thing that
    ever happened". For a flag those are the same answer. For a date pair, an amount and its
    currency, or a status and its date, they are not, and the difference is a row that is not true.
  seen_on:
    PT15018:
      detail: 316 of 1,457 loans with both court dates. Fixed by choosing one proceeding per client.
      cost: none shipped - the pair was mapped and the defect found in the same hour. The count of
        loans carrying an end date fell 2,099 -> 1,181 once each end had to come from the same
        proceeding as its start, which is the honest number.
T59:
  title: A sheet treated as one kind of thing when the seller labelled it as several
  symptom: none visible. A date lands in the right-looking column and is wrong about what it measures.
  cause: PT15018's `Proceedings Legal` is read as "the court record", and it is - but only 1,439 of
    its 2,993 rows are the bank suing the borrower. 491 are insolvency proceedings, 388 judicial
    recoveries, 7 PER and 3 pre-insolvency. Taking the earliest date on the sheet and calling it
    judicial_start_date dated a loan's litigation from an INSOLVENCY filing - merging the two
    concepts the schema deliberately keeps apart, inside a field named for one of them.
  detector: none. Every row is a real court file; the defect is in which question they answer.
  guard: a `filter` row in the registry, using the seller's OWN `Tipo de Processo` labels, so the
    classification is the seller's and not ours. It reports how many rows it drops and why.
  rule: >-
    Before aggregating a sheet, read its type column. A sheet is a drawer, not a category - the
    seller files everything about a subject in one place and labels each row. An aggregate over the
    whole drawer answers a question about the drawer, which is rarely the question being asked.
  seen_on:
    PT15018:
      detail: 889 of 2,993 rows excluded. judicial_start_date fell 3,139 -> 2,580 loans; the
        difference is loans whose only court files were insolvency proceedings.
      cost: none shipped - caught at review, by the reviewer asking whether the proceedings were
        specifically judicial. No guard would have caught it; every date parsed and no total moved.
T60:
  title: A derived value indistinguishable from a stated one
  symptom: a figure is quoted to a counterparty as the seller's, when the pipeline computed it
  cause: a period can be given as two dates, or as a start and a TERM. Both state the same fact, so
    both belong in the same field - and the moment they share it, nothing in the output says which
    rows the seller actually wrote. Portuguese exoneration runs a statutory five years and PT20008
    proves it in data (1,189 of 1,205 periods are exactly 5.00 years), so the arithmetic is sound.
    Soundness is not the issue; provenance is.
  detector: none needed.
  guard: every derived end carries `<x>_end_date_derived` in additional_attributes, naming the start
    and the term column it came from. A derived value NEVER overwrites a stated one - it is written
    only where the seller gave no end at all.
  rule: >-
    Compute freely, but never let the output forget that you computed. A reader who needs only what
    the seller stated must be able to get it with a filter, not by remembering which deals had a
    term column. The cost of the extra rows is nothing; the cost of a derived figure quoted as
    evidence in a negotiation is the whole book.
  seen_on:
    the whole pipeline:
      detail: capability added 2026-10-12 with the `duration` role; NO Portuguese deal ships a
        proceeding term today, so it derives nothing. Every duration-looking column on all twelve
        tapes is a loan term or an account age.
      cost: none. Built before it was needed, so the first tape that ships a term costs one
        registry row rather than an engine change made in a hurry.
T61:
  title: A complete partition read as if absence meant unknown
  case: part_writes_false_where_eq_writes_null
  symptom: a count of loans that are NOT insolvent comes back zero, on a book where the seller said 1,700
  cause: the standing rule is that a label says what a loan IS, not what it is not (T11, T18), so
    `eq:` writes True or NULL and never False. That is right for a Y-with-no-N column and right for
    a segment that overlaps other evidence. It is WRONG where the seller assigns every loan exactly
    one of a closed set - PT20008's fase_recuperacao is CONTENCIOSO, INSOLVENTE or PRE-CONTENCIOSO
    on all 2,905 rows with no blanks, and the three sum to EUR 5,751,844.33 exactly. There the other
    labels ARE the denial, and NULL discards a statement the seller actually made.
  detector: none. A partition and an overlapping label set look identical in the data.
  guard: a separate transform. `part:<value>` writes False on every other non-null label; `eq:`
    keeps the conservative behaviour. Choosing `part:` is a recorded judgement with a named ruler
    in the registry note, never a default and never inferred.
  rule: >-
    The conservative default is right until the seller has been exhaustive, and then it is lossy.
    Check for blanks and overlap before deciding: no blanks, no overlap, and totals that tie means
    the categorisation IS a set of statements, each one negative about every label it did not pick.
    Where any other evidence contradicts a label, stay with eq: - PT15018 flags 506 loans insolvent
    by PERSON that its Segmento column does not, so there the other labels deny nothing.
  seen_on:
    PT20008:
      detail: insolvent_flag True 1,205 / False 1,700; judicialised_flag True 579 / False 2,326.
      cost: none shipped - caught at review by the reviewer supplying the category breakdown.
    PT18019:
      detail: Perimeter partitions 31,699 rows with no blanks - Bankruptcy 9,298, Category 2 19,126,
        Category 1 1,883, Deceased 1,392. insolvent_flag now False on 22,401 rather than absent.
      cost: none shipped.
  promoted: 2026-10-13 - seen on a second deal
T63:
  title: A column that is all NULL on one deal, and a different TYPE because of it
  symptom: nothing, until a consumer reads one deal. Then sum() answers 0 where it should answer null
  cause: pandas types a column from its values, so a core column that happens to be empty on one
    book comes out `object` while the same column on its neighbour is float64. Six of the twenty
    core columns drifted - cutoff_balance, cutoff_interest, origination_amount, client_id and both
    holder flags - and one of them was PT15018's cutoff_balance, on the EUR 407m book.
    Concatenating all twelve hides it (the non-empty deals win the type), which is why it
    survived - every check that read the whole book was fine.
  detector: none. Every value is correct; only the container is wrong.
  guard: clean_accounts casts every core column to the type schema.yaml declares, immediately
    before writing, driven BY schema.yaml so the cast cannot drift from the contract. A value that
    will not cast REFUSES rather than silently becoming object again. cases.py (T63) checks all
    twelve agree, column by column.
  rule: >-
    An empty column still has a type, and the contract is what says so. A file that types itself
    from its contents promises a different thing on every deal - and the promise breaks hardest on
    the emptiest book, where there is no data to argue with. Declare, then cast; never infer.
  seen_on:
    PT15018:
      detail: cutoff_balance and cutoff_interest both object, both entirely null (this deal is
        measured on cutoff_principal). origination_amount was object on eleven of twelve.
      cost: none shipped. But `.sum()` on an object column of None returns 0, not null, and a
        warehouse load would have inferred VARCHAR for those files and NUMBER for the rest.
T64:
  title: A proven figure mistaken for a proven meaning
  symptom: the review sheet tells the reviewer to SKIP the one mapping nobody has ever checked
  cause: a column that reproduces a published total exactly is marked PROVEN, and proven rows are
    listed as safe to skip. That is right for arithmetic and wrong for meaning. PT20008's
    `Divida_Contabilistico` ties to the seller's own published 3,725,152.89 to the cent - and it is
    ACCOUNTING debt. Calling it `cutoff_principal` is a reading, not a translation; that tape names
    no capital column at all, and with no interest column either, EUR 2,026,691.44 of the total is
    unidentified. The same seller names it `Valor de Capital` on PT17013, so the wording is theirs
    to vary and ours to interpret.
  detector: none. The arithmetic is perfect; that is the problem.
  guard: a registry note opening `JUDGEMENT` overrides the tier in review.py - however well the
    number ties, the row goes in front of the reviewer. Whoever writes the mapping declares that
    the meaning is inferred, and the sheet is not allowed to overrule them.
  rule: >-
    Arithmetic settles whether a column adds up, never what it is. Those are different questions and
    only one of them can be checked by a machine. A pipeline that conflates them hands the reviewer
    a shorter list and a worse review - and the rows it removes are exactly the ones where the
    seller's wording and ours diverged, which is where the error lives.
  seen_on:
    PT20008:
      detail: cutoff_principal moved from the skip list to the read list; 1 proven, 9 to read.
      cost: none shipped - the deal was approved once with it skipped, and that approval is stale
        for other reasons. Caught by the reviewer asking whether interest and principal were
        themselves derived.
T66:
  title: Empty payment columns reported as an attribution failure
  symptom: a review sheet says the payments could not be tied to the loans, when there are none
  cause: clean_payments tested for a usable KEY before testing whether the cells held any money.
    PT20008 ships thirteen PAGAMENTOS_YYYYMM columns over 2,905 loans - 37,765 cells, every one
    0.00, confirmed by reading the workbook directly rather than the parquet. That tape is also
    anonymised, so the key test failed first and reported itself as the reason. Both statements
    were true; only one was useful, and the useless one sounded like a defect in our reading.
  detector: none needed - the count of non-zero cells is the test.
  guard: clean_payments asks "is there any money here" BEFORE "can we key it", and review.py says
    which of the two it was. A tape with no payments and a tape we cannot attribute now read
    differently on the sheet.
  rule: >-
    Report the reason a reader can act on. Where several true statements explain the same empty
    file, the one to print is the one that changes what somebody does next - "the seller sent no
    payments" ends the question, "we could not match the ids" starts a hunt for an id that would
    have found nothing.
  seen_on:
    PT20008:
      detail: 37,765 cells, all zero, across both delivered copies of the book.
      cost: none shipped, but the deal was approved twice while its sheet described the wrong
        problem, and chasing a key for it would have been wasted work.
T67:
  title: Two sheets of one tape disagreeing about the same loan
  symptom: nothing. One sheet is read, the other is not, and the disagreement never surfaces
  cause: PT15020 ships the recovery stage twice. `ANEXO_I_DADOS.FaseRecup` calls row 280 `CON`
    (litigation); `asset-index with interest.Fase_Recuperacao` calls all 5,313 rows
    Pre-Contencioso, that one included. The engine takes the base sheet and never compares, so a
    reviewer approving `judicialised_flag` sees one True and no indication that the seller's own
    second sheet says otherwise.
  detector: none yet - this needs a cross-sheet comparison of fields the registry maps from one
    sheet while another sheet carries the same fact under a different name.
  guard: the registry note on the mapping states the contradiction, names the loan and says which
    sheet was taken and why. Reported, never resolved - picking a winner silently is how one
    seller's disagreement becomes our assertion.
  rule: >-
    When a tape says a thing twice, record that it did. The base sheet wins because it defines the
    population, and that is a rule about precedence, not about truth - the other sheet is still the
    seller's own statement and a reviewer is entitled to know it exists.
  seen_on:
    PT15020:
      detail: one loan of 5,313, row 280, NIF 211527335. judicialised_flag True 1 / False 5,312.
      cost: none. But the disagreement was invisible until the reviewer asked what FaseRecup meant.
T69:
  title: A payment recorded against a person, forced onto a loan
  case: client_grain_payments_keep_loan_id_null
  symptom: a loan-level collections figure that looks complete and was invented
  cause: two tapes record collections against the BORROWER, not the account - PT15018 and PT16023,
    whose borrowers hold 1.81 and 1.76 loans each. The obvious tidy-up is to make payments match
    accounts by spreading a client's payment across their loans. There is no defensible way to do
    it - the seller did not record which account the money paid down, and any split is invented.
  detector: none - the temptation is a design decision, not a data condition.
  guard: the payments contract keeps BOTH id columns and a `grain` field. A client-grain file has
    `loan_id` NULL on every row, which states that this money cannot be attributed to one account.
  rule: >-
    Carry the grain the seller gave you and say which it is. A finer grain you did not receive
    cannot be manufactured, and an allocation nobody can defend is the same error as filling in a
    balance - it reads as evidence and is arithmetic. Where BOTH grains are offered, take the
    loan: it rolls up to the borrower whenever anybody wants that, and a borrower-grain file can
    never be pushed the other way.
  seen_on:
    PT15018:
      detail: 4,053 payments over 1,706 clients holding 32,692 loans.
      cost: none - never done, recorded so it is never proposed as a tidy-up.
    PT16023:
      detail: 6,153 payments over 1,279 clients holding 19,434 loans.
      cost: none.
  promoted: 2026-10-13 - seen on a second deal
T70:
  title: A cut-off date sitting one row above the data, unread
  case: a_cutoff_is_read_from_a_label_never_guessed
  symptom: twelve of thirteen deals with no cut-off date, and nobody had looked at the banner
  cause: finding a sheet's real header means skipping the banner rows above it, and a banner is
    exactly where a seller writes what the tape IS. PT16023's master data tape says
    `Cut-off date | 42643` in row 1 - Excel serial for 2016-09-30 - and the loader stepped over it
    to reach the headers on row 2. PT17013 and PT15018 label one too.
  detector: find_cutoff.py reads the top eight rows of every sheet of every workbook, looking for
    a LABEL (cut-off, data de corte, data de referencia, as of, reference date) with a date beside
    or below it.
  guard: it READS, never infers. A bare date in a banner is ignored; only a labelled one counts.
    Where the tape disagrees with deals.csv it reports and writes nothing, because a SHEET may
    carry its own cut-off - PT15018's Claims sheet says 2016-07-08 against the deal's 2015-09-30,
    which is T45 exactly. The payment span is printed beside it as corroboration and never as a
    corroboration - PT16023's payments stop 2016-08 against a stated 2016-09-30, which is worth more than
    either fact alone.
  rule: >-
    Read the rows you skip. A loader steps over banners to find the header, and a banner is where
    a human writes what the file is - the cut-off, the currency, the perimeter. Anything parsed
    away is a place nobody has looked.
  seen_on:
    PT16023:
      detail: cut-off 2016-09-30, read from row 1 of Masterdatatape_NBO; payments end 2016-08.
      cost: none shipped. The deal was cleaned and reconciled without one for five days.
    PT17013:
      detail: 2017-06-30, labelled `Cut-off:` on the Data sheet.
      cost: none.
  promoted: 2026-10-13 - seen on a second deal
T72:
  title: Finding which column is really the key, instead of believing its name
  symptom: none until a join returns nothing, or a fact fans out across loans that share an id
  cause: a seller names a column and that name is not a fact. PT16023 offers TWO columns called
    "Unique Loan ID" and neither is unique - 1,153 duplicates on the plain one, 2,940 on the
    variant labelled "in the System". Choosing by name picks whichever sounds most official, which
    here is the worse of the two.
  detector: none - this is a method, not a condition.
  guard: three checks, in order, each cheap and each decisive. Run on PT16023 2026-10-13.
    (1) COUNT DISTINCT against the row count, for every id-shaped column. A column that is not
    unique is not a key, whatever it is called.
    (2) Match each candidate against the servicer's own feed - raw CAT `client_ref_1` for Intrum
    books. The key is whichever THEY recognise. On PT16023 neither loan column matched a single
    value and `Client Number` matched 10,158 of 11,064 (91.8%).
    (3) Ask what the servicer's grain IS, before assuming it is the loan - compare
    COUNT(DISTINCT case_id) with COUNT(DISTINCT client_ref_1). On PT16023 both are 10,253 and no
    ref carries two cases, so Intrum's "case" is the BORROWER. That is why the deal's payments are
    client-grain - the seller and the servicer independently key on the person.
  rule: >-
    Test the key, never read it. Uniqueness says whether a column CAN be a key; the servicer's feed
    says whether it IS one; the servicer's own grain says what the book is even counted in. The
    third question is the one nobody asks, and on PT16023 it was the answer - 19,434 loans exist on
    the seller's tape and nowhere downstream at all.
  seen_on:
    PT16023:
      detail: both "Unique Loan ID" columns match CAT on zero values. Client Number matches 91.8%.
        case_id, client_ref_1 and their pairing are all exactly 10,253.
      cost: none shipped - loan_id was never used as the join key, because unique_key exists. But
        the duplicate count had been treated as a seller data problem when it is really the wrong
        column being read as a key.
T73:
  title: A forward flow cleaned as though its tape were the book
  symptom: an accounts file indistinguishable from a one-off's, carrying a total of what ARRIVED
  cause: the pipeline cleaned every mapped deal the same way, so six forward flows produced
    accounts, a long table, review sheets and backtest baselines that look exactly like a one-off
    deal's. A reader of portugal/cleaned/ could not tell that EUR 255,276,889.23 of it was the sum
    of monthly deliveries under a contract rather than six books. None of the six reconciles, which
    is the clue nobody was obliged to notice.
  detector: deal_type in deals.csv, derived from Intrum's own PAM references (YYMM tranche
    suffixes and their FF segment labels).
  guard: run.py SKIPS a forward_flow deal before anything is written - no strats, no accounts, no
    long table, no payments, no review, no baseline. prune_forward_flow.py removes outputs built
    before the rule existed, reporting first. `run.py <deal> --anyway` still cleans one on demand,
    and nothing in assets/ or the registry is touched, so it is all one command away.
  rule: >-
    Do not produce a figure nobody can approve. A forward-flow tape is a delivery, so any total
    from it answers a question about the delivery and not about the deal - and an output that
    looks like every other output will be read like every other output. Skip it at the top, not
    with a warning at the bottom.
  seen_on:
    the whole book:
      detail: six deals - PT15014, PT19007, PT19013, PT20006, PT20014, PT21004 - 53,897 loans and
        EUR 255,276,889.23, removed 2026-10-13. Seven one-offs remain, EUR 820,978,820.11.
      cost: none shipped, but the six had been reviewed in the same queue as the one-offs for days.
