# Legal-type columns used in npl-underwriting — Germany
#
# Scraped 2026-10-08 from npl-underwriting/deals/*/**.py and .ipynb.
# Deal assets are gitignored and absent, so this is what the CODE
# references, not what every tape actually shipped.
#
# ⚠ 'liquidation' is EXCLUDED throughout. In this repo it means the
#   recovery curve (sum_liquidations, log_liquidation, cumulative
#   liquidation %), not the insolvency process. Counting it as a legal
#   term would have made it the top hit in every country.

country: Germany
country_code: DE
deal_count: 8
legal_term_count: 17

deals:
  - deal: ge25020-santander
    identified_as: "LOK-DE25020 Santander Consumer Bank"
    country_basis: "prod"
  - deal: ge26004
    identified_as: "LOK-DE26004 ING-DiBa"
    country_basis: "prod"
  - deal: ge26007-santander
    identified_as: "DE26007 Santander"
    country_basis: "deal code"
  - deal: ge26009-db
    identified_as: "DE26009 Deutsche Bank"
    country_basis: "deal code"
  - deal: ge26011-db-ff
    identified_as: "DE26011 Deutsche Bank forward flow"
    country_basis: "deal code"
  - deal: korund
    identified_as: "LOK-DE25010 Deutsche Bank (Korund)"
    country_basis: "prod"
  - deal: neptune
    identified_as: "LOK-DE24016 Deutsche Bank (Neptun)"
    country_basis: "prod"
  - deal: targobank
    identified_as: "Targobank"
    country_basis: "column language (Vertragsdatum)"

# Enforced by npl_schema.CleanedAccountsSchema / CleanedPaymentsSchema.
# IDENTICAL IN EVERY COUNTRY — the schema is shared, not per-country.
mandatory_fields:
  accounts:
    - model_id  # unique
    - registration_date
    - registration_balance
    - extraction_date
  payments:
    - model_id
    - payment_date
    - payment_amount

# Schema-optional fields, and how many of this country's deals name them.
optional_fields_used:
  default_date: 8   # of 8 deals
  pricing_segment: 8   # of 8 deals
  product_type: 8   # of 8 deals
  customer_type: 6   # of 8 deals
  origination_date: 1   # of 8 deals

# Every legal-type column the code references, with the number of deals
# in this country that use it. Sorted by count, then name.
legal_terms:
  "insolvency_date":
    deals: 7
    used_by: [ge26004, ge26007-santander, ge26009-db, ge26011-db-ff, korund, neptune, targobank]
  "deceased":
    deals: 6
    used_by: [ge25020-santander, ge26004, ge26007-santander, ge26011-db-ff, korund, targobank]
  "insolvency_flag":
    deals: 6
    used_by: [ge26004, ge26007-santander, ge26009-db, ge26011-db-ff, neptune, targobank]
  "insolvency_age":
    deals: 2
    used_by: [ge26004, ge26007-santander]
  "insolvency_age_range":
    deals: 2
    used_by: [ge26004, ge26007-santander]
  "insolvency_flag_at_registration":
    deals: 2
    used_by: [korund, targobank]
  "a1 - non-insolvent":
    deals: 1
    used_by: [ge26007-santander]
  "a1_non_insolvent-intrum":
    deals: 1
    used_by: [ge26007-santander]
  "b - insolvent":
    deals: 1
    used_by: [ge26007-santander]
  "b_insolvent-intrum":
    deals: 1
    used_by: [ge26007-santander]
  "insolvency %":
    deals: 1
    used_by: [ge26011-db-ff]
  "insolvency age":
    deals: 1
    used_by: [ge26004]
  "insolvency flag":
    deals: 1
    used_by: [ge26004]
  "insolvency_age_to_registration":
    deals: 1
